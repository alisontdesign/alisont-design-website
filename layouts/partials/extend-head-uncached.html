<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
{{/* Homepage Organization structured data, appended to <head> (not cached — needs page context).
    NOTE: inside <script>, Hugo's contextual escaper JS-escapes interpolations,
    so every dynamic value must pass through jsonify AND safeJS to stay valid JSON. */}}
{{- if .IsHome -}}
  {{- $org := .Site.Params.organization -}}
  {{- if $org -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": {{ (print $.Site.BaseURL "#organization") | jsonify | safeJS }},
  "name": {{ $org.name | jsonify | safeJS }},
  {{- if $org.legalName }}
  "legalName": {{ $org.legalName | jsonify | safeJS }},
  {{- end }}
  "url": {{ $.Site.BaseURL | jsonify | safeJS }},
  {{- if $org.logo }}
  "logo": {{ (printf "%s%s" $.Site.BaseURL (strings.TrimPrefix "/" $org.logo)) | jsonify | safeJS }},
  {{- end }}
  {{- if $org.email }}
  "email": {{ $org.email | jsonify | safeJS }},
  {{- end }}
  {{- if $org.telephone }}
  "telephone": {{ $org.telephone | jsonify | safeJS }},
  {{- end }}
  {{- if $org.streetAddress }}
  "address": {
    "@type": "PostalAddress",
    "streetAddress": {{ $org.streetAddress | jsonify | safeJS }},
    {{- if $org.addressLocality }}
    "addressLocality": {{ $org.addressLocality | jsonify | safeJS }},
    {{- end }}
    {{- if $org.postalCode }}
    "postalCode": {{ $org.postalCode | jsonify | safeJS }},
    {{- end }}
    "addressCountry": {{ ($org.addressCountry | default "SG") | jsonify | safeJS }}
  },
  {{- end }}
  {{- if $org.telephone }}
  "contactPoint": [{
    "@type": "ContactPoint",
    "contactType": "sales",
    "telephone": {{ $org.telephone | jsonify | safeJS }},
    "areaServed": "SG",
    "availableLanguage": ["en", "zh"]
  }],
  {{- end }}
  "sameAs": [
    {{- $links := slice -}}
    {{- with $.Site.Params.Author.links -}}
      {{- range . -}}
        {{- range $name, $url := . -}}
          {{- if not (strings.HasPrefix $url "mailto:") -}}
            {{- $links = $links | append $url -}}
          {{- end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
    {{- range $i, $l := $links }}{{ if $i }},{{ end }}{{ $l | jsonify | safeJS }}{{ end -}}
  ]
}
</script>
  {{- end -}}
{{- end -}}
{{- if .IsHome -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "@id": {{ (print .Site.BaseURL "#business") | jsonify | safeJS }},
  "name": "Alisont Design Pte Ltd",
  "alternateName": "AlisonT Design",
  "url": {{ .Site.BaseURL | jsonify | safeJS }},
  "logo": {{ (print .Site.BaseURL "img/alisont_logo.webp") | jsonify | safeJS }},
  "image": {{ (print .Site.BaseURL "img/alisont_logo.webp") | jsonify | safeJS }},
  "description": "Singapore's first custom 3D-printed number plate workshop. Car, motorcycle and e-bike plates, custom logos, acrylic cases and frameless kits - designed, printed, sprayed and finished in house in Punggol.",
  "telephone": "+6588261189",
  "email": "alisontdesign@gmail.com",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "619D Punggol Drive",
    "addressLocality": "Singapore",
    "postalCode": "824619",
    "addressCountry": "SG"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 1.4021459,
    "longitude": 103.9111893
  },
  "areaServed": { "@type": "Country", "name": "Singapore" },
  "makesOffer": [
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom 3D printed number plates" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Motorcycle and e-bike number plates" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom plate logos, acrylic cases and frameless mounting kits" } }
  ]
}
</script>
{{- end -}}
